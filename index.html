<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/src/styles/style.css" />
    <script type="module" src="/src/js/main.js"></script>
    <title>Oihan Tech</title>
  </head>
  <body class="font-jost text-oihan-dark">
    <header class="bg-oihan-surface sticky top-0 z-50 w-full">
      <div
        class="mx-auto flex max-w-7xl items-center justify-between px-4 py-3"
      >
        <a href="/"
          ><img
            src="./src/assets/images/logo.jpg"
            alt="Oihan Tech - Accueil"
            class="h-18 w-auto"
        /></a>
        <button
          class="menu-toggle md:hidden"
          aria-expanded="false"
          aria-label="Ouvrir le menu"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="lucide lucide-menu-icon lucide-menu text-oihan-primary icon-open h-11 w-11"
          >
            <path d="M4 5h16" />
            <path d="M4 12h16" />
            <path d="M4 19h16" />
          </svg>
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="lucide lucide-x-icon lucide-x text-oihan-primary icon-close hidden h-11 w-11"
          >
            <path d="M18 6 6 18" />
            <path d="m6 6 12 12" />
          </svg>
        </button>
        <nav
          class="menu absolute top-full left-0 hidden w-full flex-col items-center justify-between gap-8 bg-white px-4 py-4 shadow-md md:static md:flex md:w-auto md:flex-row md:bg-transparent md:py-0 md:shadow-none"
        >
          <ul
            class="flex flex-col items-center gap-4 text-lg whitespace-nowrap md:flex-row"
          >
            <li>
              <a
                href="#accueil"
                class="hover:text-oihan-primary transition-colors"
                >Accueil</a
              >
            </li>
            <li>
              <a
                href="#depannage"
                class="hover:text-oihan-primary transition-colors"
                >Dépannage</a
              >
            </li>
            <li>
              <a
                href="#formation"
                class="hover:text-oihan-primary transition-colors"
                >Formation</a
              >
            </li>
            <li>
              <a
                href="#creation"
                class="hover:text-oihan-primary transition-colors"
                >Création Web</a
              >
            </li>
          </ul>
          <a
            href="#contact"
            class="contact-button bg-oihan-primary hover:bg-oihan-dark block w-full max-w-xs rounded-lg px-4 py-2 text-center font-bold text-white shadow-sm transition-colors duration-300 ease-in-out md:inline-block md:w-auto"
            >Contact</a
          >
        </nav>
      </div>
    </header>
    <main>
      <section
        id="accueil"
        class="to-oihan-surface bg-gradient-to-b from-white px-4 py-14 md:py-24"
      >
        <div
          class="mx-auto flex max-w-7xl flex-col gap-10 md:flex-row md:items-center md:gap-16"
        >
          <!-- 1. Zone texte (gauche sur desktop) -->
          <div class="flex flex-col gap-6 md:w-1/2">
            <h1
              class="text-oihan-dark text-3xl leading-tight font-bold md:text-5xl"
            >
              L'informatique simple, locale et durable à Anglet.
            </h1>

            <p class="text-oihan-dark/70 text-base leading-relaxed md:text-lg">
              Dépannage à domicile, formation personnalisée et création de sites
              web performants pour particuliers et professionnels sur la Côte
              Basque.
            </p>

            <!-- Boutons : empilés sur mobile, côte à côte sur desktop -->
            <div class="flex flex-col gap-3 md:flex-row">
              <a
                href="#services"
                class="bg-oihan-primary hover:bg-oihan-dark active:bg-oihan-dark block rounded-xl px-6 py-3 text-center font-bold text-white shadow-md transition-colors duration-300 active:scale-95"
              >
                Voir les services
              </a>
              <a
                href="#contact"
                class="border-oihan-primary text-oihan-primary hover:bg-oihan-light/40 active:bg-oihan-light/40 block rounded-xl border-2 px-6 py-3 text-center font-bold transition-colors duration-300 active:scale-95"
              >
                Demander un devis
              </a>
            </div>
          </div>

          <!-- 2. Zone image (droite sur desktop) -->
          <div class="w-full md:w-1/2">
            <img
              src="./src/assets/images/hero.jpg"
              alt="Espace de travail informatique moderne et épuré"
              class="h-auto w-full rounded-xl object-cover shadow-sm"
              width="600"
              height="400"
              loading="eager"
            />
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
